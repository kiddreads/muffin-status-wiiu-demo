name: Probe devkitPro package names
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - run: |
          for i in 1 2 3 4 5; do dkp-pacman -Sy --noconfirm --needed wut && break; sleep 15; done
          echo "=== all .a archives wut ships ==="
          dkp-pacman -Ql wut 2>/dev/null | grep -E "\.a$"
          echo "=== wut.cmake contents (how it wires link libs) ==="
          find /opt/devkitpro/wut -iname "*.cmake" -exec echo {} \; -exec cat {} \;
